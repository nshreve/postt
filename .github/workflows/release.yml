name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            artifact: postt-macos-arm64
            os: macos-latest
          - target: bun-darwin-x64
            artifact: postt-macos-x64
            os: macos-latest
          - target: bun-linux-x64
            artifact: postt-linux-x64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stub react-devtools-core
        run: |
          mkdir -p node_modules/react-devtools-core
          echo '{"name":"react-devtools-core","version":"0.0.0","main":"index.js","type":"module"}' > node_modules/react-devtools-core/package.json
          echo 'export default {connectToDevTools(){}}' > node_modules/react-devtools-core/index.js

      - name: Build binary
        run: bun build --compile --target=${{ matrix.target }} src/index.ts --outfile ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/postt-macos-arm64
            binaries/postt-macos-x64
            binaries/postt-linux-x64

